[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-poetry"
version = "1.0.0"
description = "Controlled transformer learning and Italian-sonnet adaptation experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0 AND LicenseRef-Mixed-Content" }
authors = [{ name = "Leonardo Pacciani-Mori" }]
dependencies = [
  "torch==2.10.0",
  "numpy==2.4.2",
  "beautifulsoup4==4.14.3",
  "requests==2.32.5",
  "safetensors==0.6.2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
