name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify release inventory structure
        run: python scripts/build_public_release_inventory.py --check
      - name: Run complete test suite
        run: python -m pytest
      - name: Verify static-only demo
        run: python scripts/verify_static_demo.py
      - name: Enforce cleared release gate on tags
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/build_public_release_inventory.py --check --require-cleared
